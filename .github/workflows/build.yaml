name: Build and Release Plugin

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build & Publish DLL
        run: |
          VERSION="1.0.${{ github.run_number }}.0"
          dotnet publish src/Jellyfin.Plugin.CopperFoxHome/Jellyfin.Plugin.CopperFoxHome.csproj \
            -c Release \
            -p:Version="${VERSION}" \
            -o publish


      - name: Package ZIP with meta.json & Generate manifest.json
        id: pkg
        run: |
          VERSION="1.0.${{ github.run_number }}.0"
          ZIP_NAME="copperfox-home_${VERSION}.zip"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_PATH="/foxymichelle/jellyfin-plugin-copperfox-home"
          RELEASE_PATH="releases/download/v"
          DOWNLOAD_URL="https://github.com"$REPO_PATH"/"$RELEASE_PATH$VERSION"/"$ZIP_NAME


          printf '{\n  "guid": "c099e7f0-4a1b-4c8d-9e2a-7f1b3c5d8e9a",\n  "name": "CopperFox Home",\n  "description": "Curated and personalized home screen rows for Desktop and Starfin on Roku.",\n  "overview": "Curated and personalized home screen rows for Desktop and Starfin on Roku.",\n  "owner": "foxymichelle",\n  "category": "General",\n  "version": "%s",\n  "targetAbi": "10.12.0.0",\n  "timestamp": "%s",\n  "status": "Active"\n}\n' "$VERSION" "$TIMESTAMP" > publish/meta.json

          mkdir -p release_assets
          cd publish
          zip -r "../release_assets/${ZIP_NAME}" Jellyfin.Plugin.CopperFoxHome.dll meta.json
          cd ..

          CHECKSUM=$(md5sum "release_assets/${ZIP_NAME}" | awk '{print $1}')

          printf '[\n  {\n    "guid": "c099e7f0-4a1b-4c8d-9e2a-7f1b3c5d8e9a",\n    "name": "CopperFox Home",\n    "description": "Curated and personalized home screen rows for Desktop and Starfin on Roku.",\n    "overview": "Curated and personalized home screen rows for Desktop and Starfin on Roku.",\n    "owner": "foxymichelle",\n    "category": "General",\n    "versions": [\n      {\n        "version": "%s",\n        "changelog": "Automated release v%s",\n        "targetAbi": "10.12.0.0",\n        "sourceUrl": "%s",\n        "checksum": "%s",\n        "timestamp": "%s"\n      }\n    ]\n  }\n]\n' "$VERSION" "$VERSION" "$DOWNLOAD_URL" "$CHECKSUM" "$TIMESTAMP" > manifest.json

          cat manifest.json
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip_path=release_assets/${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: CopperFox Home v${{ steps.pkg.outputs.version }}
          files: ${{ steps.pkg.outputs.zip_path }}

      - name: Commit updated manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update manifest.json for v${{ steps.pkg.outputs.version }} [skip ci]"
          git push
