<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CopperFox Home</title>
</head>
<body>
<div id="CopperFoxHomeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary" style="max-width:1540px;width:96%;">
            <form id="CopperFoxHomeConfigForm">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">CopperFox Home Configuration</h2>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="selectDiscoverLibrary">Discover / Jellybridge Library</label>
                        <select id="selectDiscoverLibrary" is="emby-select" class="emby-select-withcolor emby-select">
                            <option value="">-- None Selected --</option>
                        </select>
                        <div class="fieldDescription">Separates your Owned Library rows from Discover Only rows.</div>
                    </div>

                    <div class="sectionTitleContainer flex align-items-center" style="margin-top:2em;">
                        <h3 class="sectionTitle">1. Top Hero Slider (Row 0 — Owned Library Only)</h3>
                    </div>
                    <div style="background:#202020;border:1px solid #383838;border-radius:8px;padding:16px;margin-bottom:2em;">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:bold;">
                                <input type="checkbox" id="chkHeroEnabled" checked />
                                <span>Enable Top Hero Slider</span>
                            </label>
                            <button is="emby-button" type="button" id="btnRefreshSlider" class="raised button-alt" style="padding:6px 14px;font-size:13px;">
                                <span>Refresh Slider Cache Now</span>
                            </button>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
                            <div>
                                <label style="display:block;font-size:12px;opacity:0.8;margin-bottom:4px;">Slider Title</label>
                                <input type="text" id="txtHeroTitle" placeholder="Featured" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" />
                            </div>
                            <div>
                                <label style="display:block;font-size:12px;opacity:0.8;margin-bottom:4px;">Include Tags (optional)</label>
                                <input type="text" id="txtHeroInclude" placeholder="comma-separated tags" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" />
                            </div>
                            <div>
                                <label style="display:block;font-size:12px;opacity:0.8;margin-bottom:4px;">Exclude Tags (optional)</label>
                                <input type="text" id="txtHeroExclude" placeholder="comma-separated tags" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" />
                            </div>
                        </div>
                    </div>

                    <div class="sectionTitleContainer flex align-items-center" style="margin-top:1.5em;">
                        <h3 class="sectionTitle">2. Owned Library Rows</h3>
                    </div>
                    <div id="ownedRowsContainer" style="display:flex;flex-direction:column;gap:14px;margin-bottom:14px;"></div>
                    <button is="emby-button" type="button" id="btnAddOwnedRow" class="raised button-alt" style="margin-bottom:2em;">
                        <span>+ Add Owned Row</span>
                    </button>

                    <div class="sectionTitleContainer flex align-items-center" style="margin-top:1.5em;">
                        <h3 class="sectionTitle">3. Discover Only Rows</h3>
                    </div>
                    <div id="discoverRowsContainer" style="display:flex;flex-direction:column;gap:14px;margin-bottom:14px;"></div>
                    <button is="emby-button" type="button" id="btnAddDiscoverRow" class="raised button-alt" style="margin-bottom:2em;">
                        <span>+ Add Discover Row</span>
                    </button>

                    <div class="sectionTitleContainer flex align-items-center" style="margin-top:1.5em;">
                        <h3 class="sectionTitle">My Media Order &amp; Visibility</h3>
                    </div>
                    <div id="myMediaContainer" style="display:flex;flex-direction:column;gap:10px;margin-bottom:2em;"></div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
        </div>
    </div>
        <script type="text/javascript">
            (function () {
                var pluginId = "f7a8b9c0-1d2e-4f3a-9b8c-7d6e5f4a3b2c";
                var ownedRows = [];
                var discoverRows = [];
                var availableCollections = [];
                var availableViews = [];
                var savedMediaOrder = [];
                var excludedMediaIds = [];

                function createRowCard(row, index, listRef, renderFn, isDiscoverSection) {
                    var card = document.createElement("div");
                    card.style.cssText = "background:#202020;border:1px solid #383838;border-radius:8px;padding:16px;display:flex;flex-direction:row;align-items:stretch;gap:14px;";
                    var isCollection = row.RowType === "Collection";
                    var isSystem = ["MyMedia", "ContinueAndUpNext", "RecentlyAdded", "LatestMovies", "LatestShows", "StreamingServices"].indexOf(row.RowType) !== -1;
                    var isTopGenre = ["TopGenre1", "TopGenre2", "TopGenre3", "BecauseYouWatched"].indexOf(row.RowType) !== -1;

                    var typeOptions = isDiscoverSection
                        ? '<option value="RecentlyAdded"' + (row.RowType === "RecentlyAdded" ? " selected" : "") + '>Recently Added</option>' +
                          '<option value="LatestMovies"' + (row.RowType === "LatestMovies" ? " selected" : "") + '>Recently Added Movies</option>' +
                          '<option value="LatestShows"' + (row.RowType === "LatestShows" ? " selected" : "") + '>Recently Added Shows</option>' +
                          '<option value="StreamingServices"' + (row.RowType === "StreamingServices" ? " selected" : "") + '>Streaming Services</option>' +
                          '<option value="TagMatch"' + (row.RowType === "TagMatch" ? " selected" : "") + '>Tag Match</option>' +
                          '<option value="Genre"' + (row.RowType === "Genre" ? " selected" : "") + '>Specific Genre</option>' +
                          '<option value="TopGenre1"' + (row.RowType === "TopGenre1" ? " selected" : "") + '>User Top Genre #1</option>' +
                          '<option value="TopGenre2"' + (row.RowType === "TopGenre2" ? " selected" : "") + '>User Top Genre #2</option>' +
                          '<option value="TopGenre3"' + (row.RowType === "TopGenre3" ? " selected" : "") + '>User Top Genre #3</option>' +
                          '<option value="BecauseYouWatched"' + (row.RowType === "BecauseYouWatched" ? " selected" : "") + '>Because You Watched</option>'
                        : '<option value="MyMedia"' + (row.RowType === "MyMedia" ? " selected" : "") + '>My Media</option>' +
                          '<option value="ContinueAndUpNext"' + (row.RowType === "ContinueAndUpNext" ? " selected" : "") + '>Continue &amp; Up Next</option>' +
                          '<option value="RecentlyAdded"' + (row.RowType === "RecentlyAdded" ? " selected" : "") + '>Recently Added</option>' +
                          '<option value="LatestMovies"' + (row.RowType === "LatestMovies" ? " selected" : "") + '>Recently Added Movies</option>' +
                          '<option value="LatestShows"' + (row.RowType === "LatestShows" ? " selected" : "") + '>Recently Added Shows</option>' +
                          '<option value="Collection"' + (row.RowType === "Collection" ? " selected" : "") + '>Collection / Playlist</option>' +
                          '<option value="TagMatch"' + (row.RowType === "TagMatch" ? " selected" : "") + '>Tag Match</option>' +
                          '<option value="Genre"' + (row.RowType === "Genre" ? " selected" : "") + '>Specific Genre</option>' +
                          '<option value="TopGenre1"' + (row.RowType === "TopGenre1" ? " selected" : "") + '>User Top Genre #1</option>' +
                          '<option value="TopGenre2"' + (row.RowType === "TopGenre2" ? " selected" : "") + '>User Top Genre #2</option>' +
                          '<option value="TopGenre3"' + (row.RowType === "TopGenre3" ? " selected" : "") + '>User Top Genre #3</option>' +
                          '<option value="BecauseYouWatched"' + (row.RowType === "BecauseYouWatched" ? " selected" : "") + '>Because You Watched</option>';

                    var styleMode = row.ImageStyle || (isSystem ? "Thumb" : "Poster");
                    var radioName = (isDiscoverSection ? "discStyle_" : "ownStyle_") + index + "_" + Math.random().toString(36).slice(2, 6);

                    var arrowColHtml =
                        '<div style="display:flex;flex-direction:column;justify-content:center;gap:6px;">' +
                            '<button type="button" class="btn-up" style="height:28px;padding:0 12px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;cursor:pointer;font-size:13px;line-height:26px;">▲</button>' +
                            '<button type="button" class="btn-down" style="height:28px;padding:0 12px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;cursor:pointer;font-size:13px;line-height:26px;">▼</button>' +
                        '</div>';

                    var topHtml =
                        '<div style="display:grid;grid-template-columns:2fr 2fr auto auto;gap:12px;align-items:center;">' +
                            '<input type="text" class="row-title" value="' + (row.Title || "") + '" placeholder="Row Title (blank = auto)" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" />' +
                            '<select class="row-type" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;">' + typeOptions + '</select>' +
                            '<div style="display:flex;gap:10px;font-size:13px;">' +
                                '<label style="cursor:pointer;"><input type="radio" name="' + radioName + '" value="Poster"' + (styleMode === "Poster" ? " checked" : "") + ' /> Poster</label>' +
                                '<label style="cursor:pointer;"><input type="radio" name="' + radioName + '" value="Thumb"' + (styleMode === "Thumb" ? " checked" : "") + ' /> Thumb</label>' +
                            '</div>' +
                            '<button type="button" class="btn-del" style="padding:7px 12px;background:#7a1c1c;color:#fff;border:none;border-radius:4px;cursor:pointer;" title="Delete Row">✕</button>' +
                        '</div>';

                    var bottomHtml = "";
                    if (isCollection) {
                        var colOpts = '<option value="">-- Select Collection / Playlist --</option>';
                        availableCollections.forEach(function (c) {
                            colOpts += '<option value="' + c.Id + '"' + (row.TargetValue === c.Id ? " selected" : "") + '>' + c.Name + '</option>';
                        });
                        bottomHtml = '<select class="row-target" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;">' + colOpts + '</select>';
                    } else if (!isSystem && !isTopGenre) {
                        var incPlaceholder = row.RowType === "Genre" ? "Include genres (comma-separated)" : "Include tags (comma-separated)";
                        var excPlaceholder = row.RowType === "Genre" ? "Exclude genres (comma-separated)" : "Exclude tags (comma-separated)";
                        bottomHtml =
                            '<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:center;">' +
                                '<input type="text" class="row-target" value="' + (row.TargetValue || "") + '" placeholder="' + incPlaceholder + '" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" />' +
                                '<input type="text" class="row-exclude" value="' + (row.ExcludeTags || "") + '" placeholder="' + excPlaceholder + '" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" />' +
                                '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="checkbox" class="row-group"' + (row.GroupIntoCollections ? " checked" : "") + ' /> Group Collections</label>' +
                            '</div>';
                    }

                    card.innerHTML = arrowColHtml + '<div style="flex:1;display:flex;flex-direction:column;gap:12px;">' + topHtml + bottomHtml + '</div>';

                    card.querySelector(".row-title").onchange = function (e) { listRef[index].Title = e.target.value; };
                    card.querySelector(".row-type").onchange = function (e) {
                        var nt = e.target.value;
                        listRef[index].RowType = nt;
                        listRef[index].TargetValue = "";
                        listRef[index].ExcludeTags = "";
                        listRef[index].ImageStyle = ["MyMedia", "ContinueAndUpNext", "RecentlyAdded", "LatestMovies", "LatestShows", "StreamingServices"].indexOf(nt) !== -1 ? "Thumb" : "Poster";
                        listRef[index].GroupIntoCollections = (nt !== "Collection");                        renderFn();
                    };
                    card.querySelectorAll('input[type="radio"]').forEach(function (r) {
                        r.onchange = function (e) { if (e.target.checked) listRef[index].ImageStyle = e.target.value; };
                    });

                    var targetEl = card.querySelector(".row-target");
                    if (targetEl) targetEl.onchange = function (e) { listRef[index].TargetValue = e.target.value; };
                    var excludeEl = card.querySelector(".row-exclude");
                    if (excludeEl) excludeEl.onchange = function (e) { listRef[index].ExcludeTags = e.target.value; };
                    var groupEl = card.querySelector(".row-group");
                    if (groupEl) groupEl.onchange = function (e) { listRef[index].GroupIntoCollections = e.target.checked; };

                    card.querySelector(".btn-up").onclick = function () {
                        if (index > 0) {
                            var tmp = listRef[index - 1];
                            listRef[index - 1] = listRef[index];
                            listRef[index] = tmp;
                            renderFn();
                        }
                    };
                    card.querySelector(".btn-down").onclick = function () {
                        if (index < listRef.length - 1) {
                            var tmp = listRef[index + 1];
                            listRef[index + 1] = listRef[index];
                            listRef[index] = tmp;
                            renderFn();
                        }
                    };
                    card.querySelector(".btn-del").onclick = function () {
                        listRef.splice(index, 1);
                        renderFn();
                    };

                    return card;
                }

                function renderOwnedRows() {
                    var container = document.getElementById("ownedRowsContainer");
                    container.innerHTML = "";
                    ownedRows.forEach(function (row, idx) {
                        container.appendChild(createRowCard(row, idx, ownedRows, renderOwnedRows, false));
                    });
                }

                function renderDiscoverRows() {
                    var container = document.getElementById("discoverRowsContainer");
                    container.innerHTML = "";
                    discoverRows.forEach(function (row, idx) {
                        container.appendChild(createRowCard(row, idx, discoverRows, renderDiscoverRows, true));
                    });
                }

                function renderMyMediaList() {
                    var container = document.getElementById("myMediaContainer");
                    container.innerHTML = "";
                    var ordered = [];
                    savedMediaOrder.forEach(function (id) {
                        var found = availableViews.find(function (v) { return v.Id === id; });
                        if (found) ordered.push(found);
                    });
                    availableViews.forEach(function (v) {
                        if (!ordered.some(function (o) { return o.Id === v.Id; })) ordered.push(v);
                    });
                    availableViews = ordered;

                    availableViews.forEach(function (v, idx) {
                        var row = document.createElement("div");
                        row.style.cssText = "background:#202020;border:1px solid #383838;border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;";
                        var isChecked = excludedMediaIds.indexOf(v.Id) === -1;
                        row.innerHTML =
                            '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;">' +
                                '<input type="checkbox" class="mm-chk"' + (isChecked ? " checked" : "") + ' />' +
                                '<span>' + v.Name + '</span>' +
                            '</label>' +
                            '<div style="display:flex;gap:6px;">' +
                                '<button type="button" class="mm-up" style="padding:4px 10px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;cursor:pointer;">▲</button>' +
                                '<button type="button" class="mm-down" style="padding:4px 10px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;cursor:pointer;">▼</button>' +
                            '</div>';

                        row.querySelector(".mm-chk").onchange = function (e) {
                            if (e.target.checked) {
                                excludedMediaIds = excludedMediaIds.filter(function (x) { return x !== v.Id; });
                            } else if (excludedMediaIds.indexOf(v.Id) === -1) {
                                excludedMediaIds.push(v.Id);
                            }
                        };
                        row.querySelector(".mm-up").onclick = function () {
                            if (idx > 0) {
                                var tmp = availableViews[idx - 1];
                                availableViews[idx - 1] = availableViews[idx];
                                availableViews[idx] = tmp;
                                savedMediaOrder = availableViews.map(function (x) { return x.Id; });
                                renderMyMediaList();
                            }
                        };
                        row.querySelector(".mm-down").onclick = function () {
                            if (idx < availableViews.length - 1) {
                                var tmp = availableViews[idx + 1];
                                availableViews[idx + 1] = availableViews[idx];
                                availableViews[idx] = tmp;
                                savedMediaOrder = availableViews.map(function (x) { return x.Id; });
                                renderMyMediaList();
                            }
                        };
                        container.appendChild(row);
                    });
                }

                document.getElementById("btnAddOwnedRow").onclick = function () {
                    ownedRows.push({ Title: "", RowType: "RecentlyAdded", Scope: "OwnedOnly", TargetValue: "", ExcludeTags: "", ImageStyle: "Thumb", GroupIntoCollections: true });
                    renderOwnedRows();
                };

                document.getElementById("btnAddDiscoverRow").onclick = function () {
                    discoverRows.push({ Title: "", RowType: "RecentlyAdded", Scope: "DiscoverOnly", TargetValue: "", ExcludeTags: "", ImageStyle: "Thumb", GroupIntoCollections: true });
                    renderDiscoverRows();
                };

                document.getElementById("btnRefreshSlider").onclick = function () {
                    ApiClient.ajax({ type: "POST", url: ApiClient.getUrl("CopperFoxHome/ClearSliderCache") }).then(function () {
                        Dashboard.alert("Slider cache cleared. Reload Home to generate a fresh set.");
                    });
                };

                document.getElementById("CopperFoxHomeConfigPage").addEventListener("pageshow", function () {
                    Dashboard.showLoadingMsg();
                    var userId = ApiClient.getCurrentUserId();

                    Promise.all([
                        ApiClient.getPluginConfiguration(pluginId),
                        ApiClient.getJSON(ApiClient.getUrl("Users/" + userId + "/Items", { Recursive: true, IncludeItemTypes: "BoxSet,Playlist", SortBy: "SortName", SortOrder: "Ascending" })),
                        ApiClient.getJSON(ApiClient.getUrl("Users/" + userId + "/Views"))
                    ]).then(function (results) {
                        var config = results.shift() || {};
                        var colResp = results.shift() || {};
                        var viewResp = results.shift() || {};
                        availableCollections = (colResp.Items || []).map(function (i) { return { Id: i.Id, Name: i.Name }; });
                        availableViews = (viewResp.Items || []).map(function (v) { return { Id: v.Id, Name: v.Name }; });

                        var libSelect = document.getElementById("selectDiscoverLibrary");
                        libSelect.innerHTML = '<option value="">-- None Selected --</option>';
                        availableViews.forEach(function (v) {
                            libSelect.innerHTML += '<option value="' + v.Id + '">' + v.Name + '</option>';
                        });
                        libSelect.value = config.DiscoverLibraryId || "";

                        var allRows = config.Rows || [];
                        var legacySlider = allRows.find(function (r) { return r.RowType === "SliderRow"; });
                        var hero = config.HeroSlider || {};

                        document.getElementById("chkHeroEnabled").checked = hero.Enabled !== false;
                        document.getElementById("txtHeroTitle").value = hero.Title || (legacySlider ? legacySlider.Title : "Featured");
                        document.getElementById("txtHeroInclude").value = hero.IncludeTags || (legacySlider ? legacySlider.TargetValue : "");
                        document.getElementById("txtHeroExclude").value = hero.ExcludeTags || (legacySlider ? legacySlider.ExcludeTags : "");

                        ownedRows = allRows.filter(function (r) { return r.RowType !== "SliderRow" && r.Scope !== "DiscoverOnly"; });
                        discoverRows = allRows.filter(function (r) { return r.RowType !== "SliderRow" && r.Scope === "DiscoverOnly"; });

                        savedMediaOrder = config.MyMediaLibraryOrder || [];
                        excludedMediaIds = config.ExcludedMyMediaIds || [];

                        renderOwnedRows();
                        renderDiscoverRows();
                        renderMyMediaList();
                        Dashboard.hideLoadingMsg();
                    }).catch(function () {
                        Dashboard.hideLoadingMsg();
                    });
                });

                document.getElementById("CopperFoxHomeConfigForm").addEventListener("submit", function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();

                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.DiscoverLibraryId = document.getElementById("selectDiscoverLibrary").value;
                        config.HeroSlider = {
                            Enabled: document.getElementById("chkHeroEnabled").checked,
                            Title: document.getElementById("txtHeroTitle").value.trim() || "Featured",
                            IncludeTags: document.getElementById("txtHeroInclude").value.trim(),
                            ExcludeTags: document.getElementById("txtHeroExclude").value.trim()
                        };

                        var normalizedOwned = ownedRows.map(function (r) { r.Scope = "OwnedOnly"; return r; });
                        var normalizedDiscover = discoverRows.map(function (r) { r.Scope = "DiscoverOnly"; return r; });
                        config.Rows = normalizedOwned.concat(normalizedDiscover);
                        config.MyMediaLibraryOrder = availableViews.map(function (v) { return v.Id; });
                        config.ExcludedMyMediaIds = excludedMediaIds;

                        ApiClient.updatePluginConfiguration(pluginId, config).then(function () {
                            ApiClient.ajax({ type: "POST", url: ApiClient.getUrl("CopperFoxHome/ClearSliderCache") }).finally(function () {
                                Dashboard.processPluginConfigurationUpdateResult();
                            });
                        });
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
