<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CopperFox Home</title>
</head>
<body>
<div id="CopperFoxHomeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary" style="max-width:1540px;width:96%;">
            <form id="CopperFoxHomeConfigForm">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">CopperFox Home Settings</h2>
                </div>

                <div class="selectContainer">
                    <label class="selectLabel" for="selectDiscoverLibrary">Discover / Jellybridge Library (Optional Isolation Filter)</label>
                    <select is="emby-select" id="selectDiscoverLibrary" class="emby-select-withcolor emby-select">
                        <option value="">None (No Discover Folder)</option>
                    </select>
                </div>

                <div class="sectionTitleContainer flex align-items-center" style="margin-top:2em;">
                    <h3 class="sectionTitle">My Media Order &amp; Visibility</h3>
                </div>
                <div id="myMediaContainer" style="margin-bottom:2em;"></div>

                <div class="sectionTitleContainer flex align-items-center" style="margin-top:2em;">
                    <h3 class="sectionTitle">Home Screen Rows</h3>
                </div>

                <div id="rowsContainer"></div>

                <div style="display:flex;align-items:center;gap:16px;margin-top:1.5em;">
                    <button is="emby-button" type="button" id="btnAddRow" class="raised button-submit" style="width:auto;flex:0 0 auto;"><span>+ Add Row</span></button>
                    <button is="emby-button" type="submit" class="raised button-submit" style="flex:1;margin:0;"><span>Save</span></button>
                </div>
            </form>

        </div>
    </div>
        <script type="text/javascript">
        (function () {
            var pluginId = "c099e7f0-4a1b-4c8d-9e2a-7f1b3c5d8e9a";
            var collectionsList = [];
            var librariesList = [];
            var myMediaOrder = [];
            var excludedMyMediaIds = [];
            var currentRows = [];

            function renderMyMedia() {
                var container = document.getElementById("myMediaContainer");
                if (!container) return;
                container.innerHTML = "";

                var ordered = [];
                myMediaOrder.forEach(function (id) {
                    var found = librariesList.find(function (l) { return l.Id === id; });
                    if (found) ordered.push(found);
                });
                librariesList.forEach(function (lib) {
                    if (!ordered.some(function (o) { return o.Id === lib.Id; })) ordered.push(lib);
                });
                myMediaOrder = ordered.map(function (l) { return l.Id; });

                ordered.forEach(function (lib, idx) {
                    var isHidden = excludedMyMediaIds.indexOf(lib.Id) !== -1;
                    var rowEl = document.createElement("div");
                    rowEl.style.cssText = "display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:8px 14px;margin-bottom:8px;background:rgba(0,0,0,0.2);";
                    rowEl.innerHTML =
                        '<button type="button" class="mm-up" style="padding:2px 8px;cursor:pointer;">▲</button>' +
                        '<button type="button" class="mm-down" style="padding:2px 8px;cursor:pointer;">▼</button>' +
                        '<span style="flex:1;font-size:14px;">' + lib.Name + '</span>' +
                        '<label style="cursor:pointer;font-size:14px;display:flex;align-items:center;margin:0;"><input type="checkbox" class="mm-show" ' + (!isHidden ? 'checked' : '') + ' style="margin-right:8px;" />Show in My Media</label>';

                    rowEl.querySelector(".mm-up").onclick = function () {
                        if (idx > 0) {
                            var t = myMediaOrder[idx - 1];
                            myMediaOrder[idx - 1] = myMediaOrder[idx];
                            myMediaOrder[idx] = t;
                            renderMyMedia();
                        }
                    };
                    rowEl.querySelector(".mm-down").onclick = function () {
                        if (idx < myMediaOrder.length - 1) {
                            var t = myMediaOrder[idx + 1];
                            myMediaOrder[idx + 1] = myMediaOrder[idx];
                            myMediaOrder[idx] = t;
                            renderMyMedia();
                        }
                    };
                    rowEl.querySelector(".mm-show").onchange = function (e) {
                        if (e.target.checked) {
                            excludedMyMediaIds = excludedMyMediaIds.filter(function (id) { return id !== lib.Id; });
                        } else if (excludedMyMediaIds.indexOf(lib.Id) === -1) {
                            excludedMyMediaIds.push(lib.Id);
                        }
                    };
                    container.appendChild(rowEl);
                });
            }

            function renderRows() {
                var container = document.getElementById("rowsContainer");
                if (!container) return;
                container.innerHTML = "";

                currentRows.forEach(function (row, idx) {
                    var card = document.createElement("div");
                    card.style.cssText = "display:flex;align-items:stretch;gap:16px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:14px 16px;margin-bottom:14px;background:rgba(0,0,0,0.2);";

                    var isCollection = row.RowType === "Collection";
                    var isSystemRow = row.RowType === "MyMedia" || row.RowType === "ContinueAndUpNext" || row.RowType === "LatestMovies" || row.RowType === "LatestShows" || row.RowType === "StreamingServices";
                    var hideScope = row.RowType === "StreamingServices" || row.RowType === "MyMedia" || row.RowType === "ContinueAndUpNext";
                    var isAuto = isSystemRow || row.RowType === "TopGenre1" || row.RowType === "TopGenre2" || row.RowType === "TopGenre3" || row.RowType === "TopGenre" || row.RowType === "BecauseYouWatched";
                    var imgStyle = row.ImageStyle || "Poster";

                    var optionsHtml = '<option value="">Select Collection or Playlist</option>' +
                        collectionsList.map(function (c) {
                            return '<option value="' + c.Id + '"' + (row.TargetValue === c.Id ? ' selected' : '') + '>' + c.Name + ' (' + c.Type + ')</option>';
                        }).join("");

                    var targetPlaceholder = row.RowType === "Genre" ? "Genre (e.g. Horror, Comedy)" : "Include tags (𝘤𝘰𝘮𝘮𝘢-𝘴𝘦𝘱𝘢𝘳𝘢𝘵𝘦𝘥)";
                    var targetHtml = isCollection
                        ? '<select class="row-target" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;">' + optionsHtml + '</select>'
                        : '<input type="text" class="row-target" value="' + (row.TargetValue || "") + '" placeholder="' + targetPlaceholder + '" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" />';

                    var delBtnHtml = '<button type="button" class="btn-del" title="Remove row" style="color:#000;background:#888;border:none;border-radius:4px;font-weight:bold;padding:6px 10px;cursor:pointer;margin-left:auto;">X</button>';
                    var titlePlaceholder = isAuto ? "Row Title (𝘢𝘶𝘵𝘰)" : "Row Title";

                    var secondRowHtml = '';
                    if (!isCollection && !isAuto) {
                        secondRowHtml =
                            '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px;">' +
                                '<div>' + targetHtml + '</div>' +
                                '<div><input type="text" class="row-exclude" value="' + (row.ExcludeTags || "") + '" placeholder="Exclude tags (𝘤𝘰𝘮𝘮𝘢-𝘴𝘦𝘱𝘢𝘳𝘢𝘵𝘦𝘥)" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" /></div>' +
                                '<div style="display:flex;align-items:center;">' +
                                    '<label style="cursor:pointer;margin:0;font-size:14px;display:flex;align-items:center;"><input type="checkbox" class="row-group" ' + (row.GroupIntoCollections ? 'checked' : '') + ' style="margin-right:8px;" />Group Collections</label>' +
                                    delBtnHtml +
                                '</div>' +
                            '</div>';
                    } else if (isCollection) {
                        secondRowHtml =
                            '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px;">' +
                                '<div style="grid-column:span 2;">' + targetHtml + '</div>' +
                                '<div style="display:flex;align-items:center;">' + delBtnHtml + '</div>' +
                            '</div>';
                    } else if (isSystemRow) {
                        secondRowHtml =
                            '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px;">' +
                                '<div style="grid-column:span 2;"></div>' +
                                '<div style="display:flex;align-items:center;">' + delBtnHtml + '</div>' +
                            '</div>';
                    } else if (isAuto) {
                        secondRowHtml =
                            '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px;">' +
                                '<div style="grid-column:span 2;"></div>' +
                                '<div style="display:flex;align-items:center;">' +
                                    '<label style="cursor:pointer;margin:0;font-size:14px;display:flex;align-items:center;"><input type="checkbox" class="row-group" ' + (row.GroupIntoCollections ? 'checked' : '') + ' style="margin-right:8px;" />Group Collections</label>' +
                                    delBtnHtml +
                                '</div>' +
                            '</div>';
                    }

                    var radioColHtml = row.RowType === "StreamingServices"
                        ? '<div style="min-width:95px;"></div>'
                        : '<div style="display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:95px;border-left:1px solid rgba(255,255,255,0.12);padding-left:14px;">' +
                              '<label style="cursor:pointer;font-size:14px;display:flex;align-items:center;margin:0;"><input type="radio" name="imgStyle_' + idx + '" class="row-img-style" value="Poster" ' + (imgStyle === "Poster" ? 'checked' : '') + ' style="margin-right:6px;" />Poster</label>' +
                              '<label style="cursor:pointer;font-size:14px;display:flex;align-items:center;margin:0;"><input type="radio" name="imgStyle_' + idx + '" class="row-img-style" value="Thumb" ' + (imgStyle === "Thumb" ? 'checked' : '') + ' style="margin-right:6px;" />Thumb</label>' +
                          '</div>';

                    var scopeColHtml = hideScope
                        ? '<div></div>'
                        : '<div><select class="row-scope" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;">' +
                              '<option value="OwnedOnly"' + (row.Scope === "OwnedOnly" ? " selected" : "") + '>Owned Libraries Only</option>' +
                              '<option value="DiscoverOnly"' + (row.Scope === "DiscoverOnly" ? " selected" : "") + '>Discover Folder Only</option>' +
                          '</select></div>';

                    card.innerHTML =
                        '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:36px;">' +
                            '<button type="button" class="btn-up" style="padding:2px 8px;cursor:pointer;">▲</button>' +
                            '<strong style="font-size:13px;">#' + (idx + 1) + '</strong>' +
                            '<button type="button" class="btn-down" style="padding:2px 8px;cursor:pointer;">▼</button>' +
                        '</div>' +
                        '<div style="flex:1;min-width:0;">' +
                            '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">' +
                                '<div><select class="row-type" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:3px solid #666;border-radius:4px;">' +
                                    '<option value="MyMedia"' + (row.RowType === "MyMedia" ? " selected" : "") + '>My Media</option>' +
                                    '<option value="ContinueAndUpNext"' + (row.RowType === "ContinueAndUpNext" ? " selected" : "") + '>Continue &amp; Up Next</option>' +
                                    '<option value="LatestMovies"' + (row.RowType === "LatestMovies" ? " selected" : "") + '>Latest Movies</option>' +
                                    '<option value="LatestShows"' + (row.RowType === "LatestShows" ? " selected" : "") + '>Latest Shows</option>' +
                                    '<option value="StreamingServices"' + (row.RowType === "StreamingServices" ? " selected" : "") + '>Streaming Services</option>' +
                                    '<option value="Collection"' + (row.RowType === "Collection" ? " selected" : "") + '>Collection / Playlist</option>' +
                                    '<option value="Tag"' + (row.RowType === "Tag" || row.RowType === "Keyword" ? " selected" : "") + '>Tag Match</option>' +
                                    '<option value="Genre"' + (row.RowType === "Genre" ? " selected" : "") + '>Specific Genre</option>' +
                                    '<option value="TopGenre1"' + (row.RowType === "TopGenre1" || row.RowType === "TopGenre" ? " selected" : "") + '>User Top Genre #1</option>' +
                                    '<option value="TopGenre2"' + (row.RowType === "TopGenre2" ? " selected" : "") + '>User Top Genre #2</option>' +
                                    '<option value="TopGenre3"' + (row.RowType === "TopGenre3" ? " selected" : "") + '>User Top Genre #3</option>' +
                                    '<option value="BecauseYouWatched"' + (row.RowType === "BecauseYouWatched" ? " selected" : "") + '>Because You Watched</option>' +
                                '</select></div>' +
                                '<div><input type="text" class="row-title" value="' + (row.Title || "") + '" placeholder="' + titlePlaceholder + '" style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;" /></div>' +
                                scopeColHtml +
                            '</div>' +
                            secondRowHtml +
                        '</div>' +
                        radioColHtml;

                    card.querySelector(".row-title").oninput = function (e) { currentRows[idx].Title = e.target.value; };
                    card.querySelector(".row-type").onchange = function (e) {
                        var newType = e.target.value;
                        currentRows[idx].RowType = newType;
                        currentRows[idx].GroupIntoCollections = (newType !== "Collection" && newType !== "MyMedia" && newType !== "ContinueAndUpNext" && newType !== "LatestMovies" && newType !== "LatestShows" && newType !== "StreamingServices");
                        if (newType === "MyMedia" || newType === "ContinueAndUpNext" || newType === "LatestMovies" || newType === "LatestShows" || newType === "StreamingServices") {
                            currentRows[idx].ImageStyle = "Thumb";
                        }
                        renderRows();
                    };
                    var scopeEl = card.querySelector(".row-scope");
                    if (scopeEl) {
                        scopeEl.onchange = function (e) { currentRows[idx].Scope = e.target.value; };
                    }

                    var targetEl = card.querySelector(".row-target");
                    if (targetEl) {
                        targetEl.onchange = function (e) {
                            currentRows[idx].TargetValue = e.target.value;
                            if (currentRows[idx].RowType === "Collection" && !currentRows[idx].Title) {
                                var match = collectionsList.find(function (c) { return c.Id === e.target.value; });
                                if (match) currentRows[idx].Title = match.Name;
                                renderRows();
                            }
                        };
                    }

                    var excludeEl = card.querySelector(".row-exclude");
                    if (excludeEl) {
                        excludeEl.oninput = function (e) { currentRows[idx].ExcludeTags = e.target.value; };
                    }

                    var groupEl = card.querySelector(".row-group");
                    if (groupEl) {
                        groupEl.onchange = function (e) { currentRows[idx].GroupIntoCollections = e.target.checked; };
                    }

                    card.querySelectorAll(".row-img-style").forEach(function (radio) {
                        radio.onchange = function (e) {
                            if (e.target.checked) currentRows[idx].ImageStyle = e.target.value;
                        };
                    });

                    card.querySelector(".btn-up").onclick = function () { if (idx > 0) { var t = currentRows[idx - 1]; currentRows[idx - 1] = currentRows[idx]; currentRows[idx] = t; renderRows(); } };
                    card.querySelector(".btn-down").onclick = function () { if (idx < currentRows.length - 1) { var t = currentRows[idx + 1]; currentRows[idx + 1] = currentRows[idx]; currentRows[idx] = t; renderRows(); } };
                    card.querySelector(".btn-del").onclick = function () { currentRows.splice(idx, 1); renderRows(); };

                    container.appendChild(card);
                });
            }

            var addBtn = document.getElementById("btnAddRow");
            if (addBtn) {
                addBtn.onclick = function () {
                    currentRows.push({ Title: "", RowType: "Collection", TargetValue: "", ExcludeTags: "", GroupIntoCollections: false, ImageStyle: "Poster", Scope: "OwnedOnly", SortBy: "SortName", SortOrder: "Ascending", Limit: 12 });
                    renderRows();
                };
            }

            var form = document.getElementById("CopperFoxHomeConfigForm");
            if (form) {
                form.onsubmit = function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.DiscoverLibraryId = document.getElementById("selectDiscoverLibrary").value;
                        config.MyMediaLibraryOrder = myMediaOrder;
                        config.ExcludedMyMediaIds = excludedMyMediaIds;
                        config.Rows = currentRows;
                        return ApiClient.updatePluginConfiguration(pluginId, config);
                    }).then(function () {
                        Dashboard.processPluginConfigurationUpdateResult();
                    }).catch(function (err) {
                        Dashboard.hideLoadingMsg();
                        console.error(err);
                    });
                    return false;
                };
            }

            var userId = ApiClient.getCurrentUserId();
            Promise.all([
                ApiClient.getPluginConfiguration(pluginId),
                ApiClient.getUserViews(userId),
                ApiClient.getItems(userId, { IncludeItemTypes: "BoxSet,Playlist", Recursive: true, SortBy: "SortName" })
            ]).then(function (results) {
                var config = results[0] || {};
                librariesList = (results[1] && results[1].Items) || [];
                collectionsList = (results[2] && results[2].Items) || [];

                var libSelect = document.getElementById("selectDiscoverLibrary");
                if (libSelect) {
                    libSelect.innerHTML = '<option value="">None (No Discover Folder)</option>' +
                        librariesList.map(function (v) { return '<option value="' + v.Id + '">' + v.Name + '</option>'; }).join("");
                    libSelect.value = config.DiscoverLibraryId || "";
                }
                myMediaOrder = Array.isArray(config.MyMediaLibraryOrder) ? config.MyMediaLibraryOrder : [];
                excludedMyMediaIds = Array.isArray(config.ExcludedMyMediaIds) ? config.ExcludedMyMediaIds : [];
                currentRows = Array.isArray(config.Rows) ? config.Rows : [];
                renderMyMedia();
                renderRows();
            }).catch(function (err) {
                console.error("CopperFox Home load error:", err);
            });
        })();
    </script>
</div>
</body>
</html>
